[build]
  command = "npm install --prefix server && npm install --include=dev --prefix client && npm run build --prefix client"
  publish = "client/dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # pdfkit loads font data from its own files, so ship it unbundled from root node_modules.
  external_node_modules = ["pdfkit"]

[build.environment]
  NODE_VERSION = "20"
  # NODE_ENV's value ("production") appears in source, so don't flag it as a leaked secret.
  SECRETS_SCAN_OMIT_KEYS = "NODE_ENV"

# API goes to the Express function; everything else is the React SPA.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
